<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Info</title>
    <link rel="stylesheet" href="ajax.css">
</head>
<body>
    <header>
        <h1>Music Info</h1>
        <p>Hae tietoa albumeista kirjoittamalla artistin nimi tai valitsemalla se listasta:</p>
    </header>

    <div class="controls">
        <select id="artistSelect">
            <option value="Kendrick Lamar">Kendrick Lamar</option>
            <option value="Adele">Adele</option>
            <option value="Limp Bizkit">Limp Bizkit</option>
            <option value="Sabrina Carpenter">Sabrina Carpenter</option>
            <option value="Ed Sheeran">Ed Sheeran</option>
            <option value="The Weeknd">The Weeknd</option>
        </select>

        <input type="text" id="searchInput" placeholder="Kirjoita artistin nimi">
        <button id="searchBtn">Hae</button>
    </div>

    <main class="container">
        <div id="status" class="status"></div>
        <div id="albums" class="albums-grid"></div>
    </main>

    <footer>
        data from Last.fm API
    </footer>

    <script src="ajax.js"></script>

</body>
</html>
